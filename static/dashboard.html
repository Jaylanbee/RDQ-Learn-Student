<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDQ 極簡學習儀表板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f5f7fa; color: #333; }
        .section { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1, h2 { color: #2c3e50; }
        .radar-container { position: relative; height: 300px; width: 100%; display: flex; justify-content: center; }
        .weakness-alert { text-align: center; color: #e74c3c; font-weight: bold; margin-top: 10px; }

        .task-card { border: 1px solid #e1e8ed; border-radius: 8px; padding: 15px; margin-bottom: 15px; background: #fafbfc; }
        .task-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9em; color: #7f8c8d; }
        .badge { padding: 3px 8px; border-radius: 12px; font-weight: bold; }
        .box-badge { background: #3498db; color: white; }

        .friction-zone { margin: 15px 0; }
        textarea { width: 100%; height: 60px; padding: 10px; border-radius: 6px; border: 1px solid #bdc3c7; box-sizing: border-box; resize: vertical;}

        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-primary { background: #3498db; color: white; }
        .btn-primary:disabled { background: #bdc3c7; cursor: not-allowed; }
        .btn-success { background: #2ecc71; color: white; }
        .btn-danger { background: #e74c3c; color: white; }

        .answer-zone { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #bdc3c7; }
        .action-buttons { display: flex; gap: 10px; margin-top: 15px; }

        .pending-card { border-left: 4px solid #f1c40f; }

        img { max-width: 100%; height: auto; border-radius: 4px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>RDQ 極簡學習儀表板</h1>

    <div class="section">
        <h2>🛡️ 戰力防護罩 (消滅率)</h2>
        <div class="radar-container">
            <canvas id="radarChart"></canvas>
        </div>
        <div id="weaknessAlert" class="weakness-alert"></div>
    </div>

    <div class="section" id="pendingSection" style="display:none;">
        <h2>❓ 未知碎片 (待人工確認) <span id="pendingCount"></span></h2>
        <div id="pendingList"></div>
    </div>

    <div class="section">
        <h2>🔥 今日防禦任務</h2>
        <div id="taskList"></div>
        <div id="emptyState" style="display:none; text-align:center; padding: 30px; color: #27ae60; font-size: 1.2em; font-weight: bold;">
            🎉 今日防禦任務完成，去休息吧！
        </div>
    </div>

    <script>
        const subjectMap = {
            'math': '數學', 'science': '自然', 'chinese': '國文', 'english': '英文', 'social': '社會'
        };

        async function loadDashboard() {
            // Load Stats
            const statsRes = await fetch('/api/dashboard/stats');
            const statsData = await statsRes.json();

            const labels = [];
            const data = [];
            let weakestSubject = '';
            let lowestRate = 1.1;

            for (const [subj, info] of Object.entries(statsData.radar)) {
                labels.push(subjectMap[subj] || subj);
                data.push(info.kill_rate * 100);
                if (info.kill_rate < lowestRate) {
                    lowestRate = info.kill_rate;
                    weakestSubject = subjectMap[subj] || subj;
                }
            }

            if (weakestSubject && lowestRate < 1) {
                document.getElementById('weaknessAlert').innerText = `⚠️ 目前最大弱點：${weakestSubject}`;
            }

            renderRadar(labels, data);

            // Handle Pending
            if (statsData.pending_count > 0) {
                document.getElementById('pendingSection').style.display = 'block';
                document.getElementById('pendingCount').innerText = `(${statsData.pending_count})`;
                loadPendingTasks();
            } else {
                document.getElementById('pendingSection').style.display = 'none';
            }

            // Load Tasks
            const tasksRes = await fetch('/api/dashboard/tasks');
            const tasksData = await tasksRes.json();
            renderTasks(tasksData.tasks);
        }

        function renderRadar(labels, data) {
            const ctx = document.getElementById('radarChart').getContext('2d');
            if(window.radarChartInstance) window.radarChartInstance.destroy();
            window.radarChartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '消滅率 (%)',
                        data: data,
                        backgroundColor: 'rgba(52, 152, 219, 0.2)',
                        borderColor: 'rgba(52, 152, 219, 1)',
                        pointBackgroundColor: 'rgba(52, 152, 219, 1)',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: 'rgba(52, 152, 219, 1)'
                    }]
                },
                options: {
                    scales: { r: { min: 0, max: 100, ticks: { display: false } } },
                    maintainAspectRatio: false
                }
            });
        }

        async function loadPendingTasks() {
            const res = await fetch('/api/dashboard/pending');
            const data = await res.json();
            const list = document.getElementById('pendingList');
            list.innerHTML = '';

            data.pending.forEach(p => {
                list.innerHTML += `
                    <div class="task-card pending-card" id="pending-${p.id}">
                        <div class="task-header">
                            <span>待確認 (置信度: ${Math.round(p.llm_confidence*100)}%)</span>
                            <span>${p.subject} | ${p.eds_x_code}</span>
                        </div>
                        ${p.extracted_text ? `<p>${p.extracted_text}</p>` : ''}
                        ${p.image_path ? `<img src="${p.image_path}">` : ''}
                        <div class="action-buttons">
                            <button class="btn btn-success" onclick="approvePending(${p.id})">✅ 轉正入庫</button>
                            <button class="btn btn-danger" onclick="rejectPending(${p.id})">🗑️ 報廢刪除</button>
                        </div>
                    </div>
                `;
            });
        }

        async function approvePending(id) {
            await fetch(`/api/staging/${id}/approve`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({priority: 'yellow'}) // Simplified for demo
            });
            loadDashboard();
        }

        async function rejectPending(id) {
            await fetch(`/api/staging/${id}/reject`, { method: 'POST' });
            loadDashboard();
        }

        function renderTasks(tasks) {
            const list = document.getElementById('taskList');
            const emptyState = document.getElementById('emptyState');
            list.innerHTML = '';

            if (!tasks || tasks.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            tasks.forEach(t => {
                const mediaHtml = t.media_path ? `<img src="${t.media_path}">` : '';
                const textHtml = t.extracted_text ? `<p>${t.extracted_text}</p>` : '<p>(無題目文字，請參考系統原始覆盤)</p>';

                list.innerHTML += `
                    <div class="task-card" id="task-${t.item_id}">
                        <div class="task-header">
                            <span>${subjectMap[t.subject] || t.subject} | ${t.eds_x_code}</span>
                            <span class="badge box-badge">Box ${t.box}</span>
                        </div>
                        <div class="question-zone">
                            ${textHtml}
                            ${mediaHtml}
                        </div>

                        <div class="friction-zone" id="friction-${t.item_id}">
                            <textarea placeholder="✏️ 請在腦中組織解釋，並輸入解題關鍵字後才能翻牌..." oninput="checkInput(${t.item_id}, this)"></textarea>
                            <button class="btn btn-primary" id="btn-reveal-${t.item_id}" disabled onclick="revealAnswer(${t.item_id})">我已想好解釋，看答案 👉</button>
                        </div>

                        <div class="answer-zone" id="answer-${t.item_id}">
                            <p><strong>💡 系統提示：</strong> 這題您先前標記為 ${t.priority} 優先級。請誠實自評您的邏輯是否正確。</p>
                            <div class="action-buttons">
                                <button class="btn btn-success" onclick="submitTask(${t.item_id}, 'correct')">✅ 我的邏輯正確 (晉級)</button>
                                <button class="btn btn-danger" onclick="submitTask(${t.item_id}, 'incorrect')">🔄 想錯了 (高壓降級)</button>
                                <button class="btn" style="background:#95a5a6; color:white;" onclick="submitTask(${t.item_id}, 'reject')">🗑️ 題目無效報廢</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function checkInput(id, textarea) {
            const btn = document.getElementById(`btn-reveal-${id}`);
            btn.disabled = textarea.value.trim().length === 0;
        }

        function revealAnswer(id) {
            document.getElementById(`friction-${id}`).style.display = 'none';
            document.getElementById(`answer-${id}`).style.display = 'block';
        }

        async function submitTask(id, action) {
            document.getElementById(`task-${id}`).style.opacity = '0.5';
            await fetch(`/api/task/${id}/action`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: action})
            });
            loadDashboard(); // Reload to update stats and list
        }

        // Initialize
        loadDashboard();
    </script>
</body>
</html>
