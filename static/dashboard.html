<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDQ 學習儀表板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ==========================================================================
           Apple Design System v1.0
           ========================================================================== */

        :root {
            /* Z-index */
            --z-base: 0;
            --z-floating: 100;
            --z-navbar: 500;
            --z-dropdown: 1000;
            --z-modal: 2000;
            --z-toast: 3000;

            /* Spacing (8pt system) */
            --sp-1: 8px; --sp-2: 16px; --sp-3: 24px; --sp-4: 32px; --sp-6: 48px; --sp-8: 64px;

            /* Radius */
            --rad-sm: 16px;
            --rad-md: 20px;
            --rad-lg: 24px;
            --rad-hero: 32px;
            --rad-cta: 9999px;

            /* Light Theme Colors (Default) */
            --bg-color: #F5F5F7;
            --surface-color: #FFFFFF;
            --surface-secondary: #FBFBFD;
            --text-primary: #1D1D1F;
            --text-secondary: #6E6E73;
            --divider: #D2D2D7;
            --accent: #0071E3;

            /* Categorical Colors */
            --chart-blue: #5AC8FA;
            --chart-green: #34C759;
            --chart-indigo: #5856D6;
            --chart-orange: #FF9F0A;

            /* Status Colors */
            --status-error: #FF3B30;
            --status-warning: #FF9F0A;
            --status-success: #34C759;

            /* Material */
            --shadow-subtle: 0 8px 32px rgba(0,0,0,0.04);
            --border-subtle: 1px solid rgba(0,0,0,0.05);
            --glass-bg: rgba(255,255,255,0.72);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* Dark Theme Colors */
                --bg-color: #000000;
                --surface-color: #1C1C1E;
                --surface-secondary: #2C2C2E;
                --text-primary: #F5F5F7;
                --text-secondary: #AEAEB2;
                --divider: #3A3A3C;
                --accent: #0A84FF;

                /* Categorical Colors */
                --chart-blue: #64D2FF;
                --chart-green: #30D158;
                --chart-indigo: #5E5CE6;
                --chart-orange: #FFD60A;

                /* Material */
                --shadow-subtle: none;
                --border-subtle: 1px solid rgba(255,255,255,0.08);
                --glass-bg: rgba(28,28,30,0.72);
            }
        }

        /* Base Styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Noto Sans TC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: var(--sp-4) var(--sp-2);
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 768px; /* Tablet BP */
            z-index: var(--z-base);
        }

        h1 { font-size: 32px; font-weight: 700; margin-bottom: var(--sp-4); letter-spacing: -0.005em; text-align: center; }
        h2 { font-size: 22px; font-weight: 600; margin-bottom: var(--sp-3); letter-spacing: -0.01em; }
        p { font-size: 17px; line-height: 1.47; color: var(--text-primary); margin-top: 0; }

        /* Card Section */
        .section {
            background-color: var(--surface-color);
            border: var(--border-subtle);
            border-radius: var(--rad-lg);
            padding: var(--sp-4);
            margin-bottom: var(--sp-4);
            box-shadow: var(--shadow-subtle);
        }

        /* Radar Chart */
        .radar-container {
            position: relative;
            height: 320px;
            width: 100%;
        }
        .weakness-alert {
            text-align: center;
            color: var(--status-warning);
            font-weight: 600;
            margin-top: var(--sp-2);
            font-size: 15px;
        }

        /* Tasks & Cards */
        .task-card {
            background-color: var(--surface-secondary);
            border-radius: var(--rad-md);
            padding: var(--sp-3);
            margin-bottom: var(--sp-2);
            border: var(--border-subtle);
            transition: transform 300ms cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Spring click */
            z-index: var(--z-floating);
            position: relative;
        }
        .task-card:active {
            transform: scale(0.98);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--sp-2);
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .badge {
            background-color: var(--accent);
            color: #FFF;
            padding: 4px 10px;
            border-radius: var(--rad-cta);
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.02em;
        }

        /* Inputs (Physical Friction) */
        .friction-zone { margin: var(--sp-3) 0; }
        textarea {
            width: 100%;
            height: 80px;
            padding: var(--sp-2);
            border-radius: var(--rad-sm);
            border: 1px solid var(--divider);
            background-color: var(--surface-color);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 15px;
            box-sizing: border-box;
            resize: vertical;
            transition: border-color 250ms ease-out, box-shadow 250ms ease-out;
        }
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.2);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border: none;
            border-radius: var(--rad-cta);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 250ms ease-out;
            width: 100%;
            margin-top: var(--sp-2);
            box-shadow: none; /* Flat design per spec */
        }
        .btn:active:not(:disabled) {
            transform: scale(0.96);
        }
        .btn-primary { background-color: var(--accent); color: white; }
        .btn-primary:hover:not(:disabled) { opacity: 0.9; }
        .btn-primary:disabled { background-color: var(--divider); color: var(--text-secondary); cursor: not-allowed; opacity: 0.7; }

        .btn-success { background-color: var(--status-success); color: white; }
        .btn-danger { background-color: var(--status-error); color: white; }

        .action-buttons {
            display: flex;
            gap: var(--sp-2);
            flex-direction: column;
            margin-top: var(--sp-3);
        }
        @media (min-width: 768px) {
            .action-buttons { flex-direction: row; }
        }

        /* Answer Zone (Progressive Disclosure) */
        .answer-zone {
            display: none;
            margin-top: var(--sp-3);
            padding-top: var(--sp-3);
            border-top: 1px solid var(--divider);
            animation: fadeInDown 350ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Pending Zone (Glassmorphism Modal-like style) */
        .pending-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: var(--border-subtle);
            border-left: 4px solid var(--status-warning);
        }

        img { max-width: 100%; border-radius: var(--rad-sm); margin-top: var(--sp-2); }

        .empty-state { text-align: center; padding: var(--sp-6) var(--sp-2); color: var(--text-secondary); font-size: 17px; }

    </style>
</head>
<body>
    <div class="container">
        <h1>RDQ 學習儀表板</h1>

        <!-- 雷達圖區塊 -->
        <div class="section">
            <h2>戰力防護罩</h2>
            <div class="radar-container">
                <canvas id="radarChart"></canvas>
            </div>
            <div id="weaknessAlert" class="weakness-alert"></div>
        </div>

        <!-- 未知碎片區塊 -->
        <div class="section" id="pendingSection" style="display:none;">
            <h2>未知碎片 <span id="pendingCount" style="color: var(--text-secondary); font-weight: normal; font-size: 17px;"></span></h2>
            <div id="pendingList"></div>
        </div>

        <!-- 今日任務區塊 -->
        <div class="section">
            <h2>今日防禦任務</h2>
            <div id="taskList"></div>
            <div id="emptyState" class="empty-state" style="display:none;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--status-success); margin-bottom: 16px;">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <br>
                今日防禦任務完成，好好休息吧！
            </div>
        </div>
    </div>

    <script>
        const subjectMap = {
            'math': '數學', 'science': '自然', 'chinese': '國文', 'english': '英文', 'social': '社會'
        };

        // Handle Dark Mode for Chart.js
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const gridColor = prefersDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)';
        const tickColor = prefersDark ? '#AEAEB2' : '#6E6E73';

        async function loadDashboard() {
            try {
                // Load Stats
                const statsRes = await fetch('/api/dashboard/stats');
                const statsData = await statsRes.json();

                const labels = [];
                const data = [];
                let weakestSubject = '';
                let lowestRate = 1.1;

                for (const [subj, info] of Object.entries(statsData.radar)) {
                    labels.push(subjectMap[subj] || subj);
                    data.push(info.kill_rate * 100);
                    if (info.kill_rate < lowestRate) {
                        lowestRate = info.kill_rate;
                        weakestSubject = subjectMap[subj] || subj;
                    }
                }

                if (weakestSubject && lowestRate < 1) {
                    document.getElementById('weaknessAlert').innerText = `目前最大弱點：${weakestSubject}`;
                } else {
                    document.getElementById('weaknessAlert').innerText = '';
                }

                renderRadar(labels, data);

                // Handle Pending
                if (statsData.pending_count > 0) {
                    document.getElementById('pendingSection').style.display = 'block';
                    document.getElementById('pendingCount').innerText = `${statsData.pending_count} 待處理`;
                    loadPendingTasks();
                } else {
                    document.getElementById('pendingSection').style.display = 'none';
                }

                // Load Tasks
                const tasksRes = await fetch('/api/dashboard/tasks');
                const tasksData = await tasksRes.json();
                renderTasks(tasksData.tasks);
            } catch (error) {
                console.error("Failed to load dashboard data:", error);
            }
        }

        function renderRadar(labels, data) {
            const ctx = document.getElementById('radarChart').getContext('2d');

            // Get CSS variable color
            const style = getComputedStyle(document.body);
            const chartColor = style.getPropertyValue('--chart-blue').trim() || '#5AC8FA';

            if(window.radarChartInstance) window.radarChartInstance.destroy();
            window.radarChartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '掌握度',
                        data: data,
                        backgroundColor: chartColor + '33', // 20% opacity
                        borderColor: chartColor,
                        borderWidth: 2,
                        pointBackgroundColor: chartColor,
                        pointBorderColor: 'var(--surface-color)',
                        pointHoverBackgroundColor: 'var(--surface-color)',
                        pointHoverBorderColor: chartColor
                    }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    scales: {
                        r: {
                            min: 0, max: 100,
                            ticks: { display: false },
                            grid: { color: gridColor },
                            pointLabels: { color: tickColor, font: { size: 14, family: 'system-ui' } }
                        }
                    },
                    maintainAspectRatio: false
                }
            });
        }

        async function loadPendingTasks() {
            const res = await fetch('/api/dashboard/pending');
            const data = await res.json();
            const list = document.getElementById('pendingList');
            list.innerHTML = '';

            data.pending.forEach(p => {
                list.innerHTML += `
                    <div class="task-card pending-card" id="pending-${p.id}">
                        <div class="task-header">
                            <span style="color: var(--status-warning)">置信度: ${Math.round(p.llm_confidence*100)}%</span>
                            <span>${subjectMap[p.subject] || p.subject} | ${p.eds_x_code}</span>
                        </div>
                        ${p.extracted_text ? `<p style="font-size: 15px;">${p.extracted_text}</p>` : ''}
                        ${p.image_path ? `<img src="${p.image_path}">` : ''}
                        <div class="action-buttons">
                            <button class="btn btn-primary" onclick="approvePending(${p.id})">轉正入庫</button>
                            <button class="btn" style="background: var(--surface-secondary); color: var(--text-primary); border: 1px solid var(--divider);" onclick="rejectPending(${p.id})">刪除報廢</button>
                        </div>
                    </div>
                `;
            });
        }

        async function approvePending(id) {
            await fetch(`/api/staging/${id}/approve`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({priority: 'yellow'})
            });
            loadDashboard();
        }

        async function rejectPending(id) {
            await fetch(`/api/staging/${id}/reject`, { method: 'POST' });
            loadDashboard();
        }

        function renderTasks(tasks) {
            const list = document.getElementById('taskList');
            const emptyState = document.getElementById('emptyState');
            list.innerHTML = '';

            if (!tasks || tasks.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            tasks.forEach(t => {
                const mediaHtml = t.media_path ? `<img src="${t.media_path}">` : '';
                const textHtml = t.extracted_text ? `<p>${t.extracted_text}</p>` : '<p style="color: var(--text-secondary)">(原始對話覆盤)</p>';

                let priorityIcon = '';
                if(t.priority === 'red') priorityIcon = '🔴';
                if(t.priority === 'yellow') priorityIcon = '🟡';
                if(t.priority === 'green') priorityIcon = '🟢';

                list.innerHTML += `
                    <div class="task-card" id="task-${t.item_id}">
                        <div class="task-header">
                            <span>${priorityIcon} ${subjectMap[t.subject] || t.subject} | ${t.eds_x_code}</span>
                            <span class="badge">Box ${t.box}</span>
                        </div>
                        <div class="question-zone">
                            ${textHtml}
                            ${mediaHtml}
                        </div>

                        <div class="friction-zone" id="friction-${t.item_id}">
                            <textarea placeholder="請在此輸入解題關鍵字以解鎖答案..." oninput="checkInput(${t.item_id}, this)"></textarea>
                            <button class="btn btn-primary" id="btn-reveal-${t.item_id}" disabled onclick="revealAnswer(${t.item_id})">我已想好解釋，看答案</button>
                        </div>

                        <div class="answer-zone" id="answer-${t.item_id}">
                            <p style="font-size: 15px; color: var(--text-secondary);">請誠實自評您的邏輯是否正確：</p>
                            <div class="action-buttons">
                                <button class="btn btn-success" onclick="submitTask(${t.item_id}, 'correct')">我的邏輯正確</button>
                                <button class="btn btn-danger" onclick="submitTask(${t.item_id}, 'incorrect')">想錯了 / 忘了</button>
                                <button class="btn" style="background: var(--surface-secondary); color: var(--text-primary); border: 1px solid var(--divider);" onclick="submitTask(${t.item_id}, 'reject')">題目無效報廢</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function checkInput(id, textarea) {
            const btn = document.getElementById(`btn-reveal-${id}`);
            btn.disabled = textarea.value.trim().length === 0;
        }

        function revealAnswer(id) {
            document.getElementById(`friction-${id}`).style.display = 'none';
            document.getElementById(`answer-${id}`).style.display = 'block';
        }

        async function submitTask(id, action) {
            const card = document.getElementById(`task-${id}`);
            card.style.opacity = '0.5';
            card.style.pointerEvents = 'none';

            await fetch(`/api/task/${id}/action`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: action})
            });

            // Soft exit animation
            card.style.transform = 'scale(0.95)';
            setTimeout(() => loadDashboard(), 250);
        }

        // Initialize
        loadDashboard();
    </script>
</body>
</html>
