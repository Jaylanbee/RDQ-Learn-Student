<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDQ 學習儀表板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ==========================================================================
           Apple Design System v1.0
           ========================================================================== */

        :root {
            /* Z-index */
            --z-base: 0;
            --z-floating: 100;
            --z-navbar: 500;
            --z-dropdown: 1000;
            --z-modal: 2000;
            --z-toast: 3000;

            /* Spacing (8pt system) */
            --sp-1: 8px; --sp-2: 16px; --sp-3: 24px; --sp-4: 32px; --sp-6: 48px; --sp-8: 64px;

            /* Radius */
            --rad-sm: 16px;
            --rad-md: 20px;
            --rad-lg: 24px;
            --rad-hero: 32px;
            --rad-cta: 9999px;

            /* Light Theme Colors (Default) */
            --bg-color: #F5F5F7;
            --surface-color: #FFFFFF;
            --surface-secondary: #FBFBFD;
            --text-primary: #1D1D1F;
            --text-secondary: #6E6E73;
            --divider: #D2D2D7;
            --accent: #0071E3;

            /* Categorical Colors */
            --chart-blue: #5AC8FA;
            --status-error: #FF3B30;
            --status-warning: #FF9F0A;
            --status-success: #34C759;

            /* Material */
            --shadow-subtle: 0 8px 32px rgba(0,0,0,0.04);
            --border-subtle: 1px solid rgba(0,0,0,0.05);
            --glass-bg: rgba(255,255,255,0.72);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --surface-color: #1C1C1E;
                --surface-secondary: #2C2C2E;
                --text-primary: #F5F5F7;
                --text-secondary: #AEAEB2;
                --divider: #3A3A3C;
                --accent: #0A84FF;
                --chart-blue: #64D2FF;
                --shadow-subtle: none;
                --border-subtle: 1px solid rgba(255,255,255,0.08);
                --glass-bg: rgba(28,28,30,0.72);
            }
        }

        /* Base Styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Noto Sans TC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: var(--sp-4) var(--sp-2) 100px var(--sp-2); /* Extra padding for FAB */
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 768px; /* Tablet BP */
            z-index: var(--z-base);
        }

        h1 { font-size: 32px; font-weight: 700; margin-bottom: var(--sp-4); letter-spacing: -0.005em; text-align: center; }
        h2 { font-size: 22px; font-weight: 600; margin-bottom: var(--sp-3); letter-spacing: -0.01em; }
        p { font-size: 17px; line-height: 1.47; color: var(--text-primary); margin-top: 0; }

        /* Card Section */
        .section {
            background-color: var(--surface-color);
            border: var(--border-subtle);
            border-radius: var(--rad-lg);
            padding: var(--sp-4);
            margin-bottom: var(--sp-4);
            box-shadow: var(--shadow-subtle);
        }

        /* Radar Chart */
        .radar-container {
            position: relative;
            height: 320px;
            width: 100%;
        }
        .weakness-alert {
            text-align: center;
            color: var(--status-warning);
            font-weight: 600;
            margin-top: var(--sp-2);
            font-size: 15px;
        }

        /* Tasks & Cards */
        .task-card {
            background-color: var(--surface-secondary);
            border-radius: var(--rad-md);
            padding: var(--sp-3);
            margin-bottom: var(--sp-2);
            border: var(--border-subtle);
            transition: transform 300ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: var(--z-floating);
            position: relative;
        }
        .task-card:active { transform: scale(0.98); }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--sp-2);
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .badge {
            background-color: var(--accent);
            color: #FFF;
            padding: 4px 10px;
            border-radius: var(--rad-cta);
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.02em;
        }

        /* Inputs */
        .friction-zone { margin: var(--sp-3) 0; }
        textarea {
            width: 100%;
            height: 80px;
            padding: var(--sp-2);
            border-radius: var(--rad-sm);
            border: 1px solid var(--divider);
            background-color: var(--surface-color);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 15px;
            box-sizing: border-box;
            resize: vertical;
            transition: border-color 250ms ease-out, box-shadow 250ms ease-out;
        }
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.2);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border: none;
            border-radius: var(--rad-cta);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 250ms ease-out;
            width: 100%;
            margin-top: var(--sp-2);
        }
        .btn:active:not(:disabled) { transform: scale(0.96); }
        .btn-primary { background-color: var(--accent); color: white; }
        .btn-primary:hover:not(:disabled) { opacity: 0.9; }
        .btn-primary:disabled { background-color: var(--divider); color: var(--text-secondary); cursor: not-allowed; opacity: 0.7; }
        .btn-success { background-color: var(--status-success); color: white; }
        .btn-danger { background-color: var(--status-error); color: white; }

        .action-buttons {
            display: flex;
            gap: var(--sp-2);
            flex-direction: column;
            margin-top: var(--sp-3);
        }
        @media (min-width: 768px) { .action-buttons { flex-direction: row; } }

        /* Answer Zone */
        .answer-zone {
            display: none;
            margin-top: var(--sp-3);
            padding-top: var(--sp-3);
            border-top: 1px solid var(--divider);
            animation: fadeInDown 350ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Pending Zone */
        .pending-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: var(--border-subtle);
            border-left: 4px solid var(--status-warning);
        }

        img { max-width: 100%; border-radius: var(--rad-sm); margin-top: var(--sp-2); }
        .empty-state { text-align: center; padding: var(--sp-6) var(--sp-2); color: var(--text-secondary); font-size: 17px; }

        /* FAB & Modal for Upload */
        .fab {
            position: fixed;
            bottom: var(--sp-4);
            right: var(--sp-4);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: var(--accent);
            color: white;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0, 113, 227, 0.4);
            cursor: pointer;
            z-index: var(--z-floating);
            transition: transform 300ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .fab:hover { transform: scale(1.05); }
        .fab:active { transform: scale(0.95); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            z-index: var(--z-modal);
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 200ms ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-content {
            background-color: var(--surface-color);
            border-radius: var(--rad-hero);
            padding: var(--sp-4);
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transform: scale(0.95);
            animation: modalPop 300ms cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes modalPop { to { transform: scale(1); } }

        .file-upload-zone {
            border: 2px dashed var(--divider);
            border-radius: var(--rad-sm);
            padding: var(--sp-4);
            text-align: center;
            color: var(--text-secondary);
            margin: var(--sp-3) 0;
            cursor: pointer;
            transition: all 250ms ease-out;
        }
        .file-upload-zone:hover {
            border-color: var(--accent);
            background-color: rgba(0, 113, 227, 0.05);
        }
        .file-upload-zone input[type="file"] { display: none; }

        .upload-preview {
            display: none;
            margin-top: var(--sp-2);
            text-align: center;
            font-weight: 600;
            color: var(--accent);
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>RDQ 學習儀表板</h1>

        <div class="section">
            <h2>戰力防護罩</h2>
            <div class="radar-container">
                <canvas id="radarChart"></canvas>
            </div>
            <div id="weaknessAlert" class="weakness-alert"></div>
        </div>

        <div class="section" id="pendingSection" style="display:none;">
            <h2>未知碎片 <span id="pendingCount" style="color: var(--text-secondary); font-weight: normal; font-size: 17px;"></span></h2>
            <div id="pendingList"></div>
        </div>

        <div class="section">
            <h2>今日防禦任務</h2>
            <div id="taskList"></div>
            <div id="emptyState" class="empty-state" style="display:none;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--status-success); margin-bottom: 16px;">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <br>
                今日防禦任務完成，好好休息吧！
            </div>
        </div>
    </div>

    <!-- FAB for Upload -->
    <div class="fab" onclick="openUploadModal()">➕</div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal" onclick="closeUploadModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 style="margin-top: 0; text-align: center;">匯入外部錯題</h2>
            <p style="text-align: center; font-size: 14px; color: var(--text-secondary);">上傳考卷照片，AI 將自動為您萃取並排程。</p>

            <textarea id="uploadText" placeholder="輸入題目或備註 (選填)"></textarea>

            <div class="file-upload-zone" onclick="document.getElementById('fileInput').click()">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 8px;">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <br>
                點擊選擇照片 / 開啟相機 📷
                <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="handleFileSelect(this)">
            </div>
            <div class="upload-preview" id="uploadPreview">已選擇照片：<span id="fileName"></span></div>

            <button class="btn btn-primary" id="btnUploadSubmit" onclick="submitUpload()">送出解析</button>
        </div>
    </div>

    <script>
        const subjectMap = { 'math': '數學', 'science': '自然', 'chinese': '國文', 'english': '英文', 'social': '社會' };
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const gridColor = prefersDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)';
        const tickColor = prefersDark ? '#AEAEB2' : '#6E6E73';

        async function loadDashboard() {
            try {
                const statsRes = await fetch('/api/dashboard/stats');
                const statsData = await statsRes.json();

                const labels = [];
                const data = [];
                let weakestSubject = '';
                let lowestRate = 1.1;

                for (const [subj, info] of Object.entries(statsData.radar)) {
                    labels.push(subjectMap[subj] || subj);
                    data.push(info.kill_rate * 100);
                    if (info.kill_rate < lowestRate) {
                        lowestRate = info.kill_rate;
                        weakestSubject = subjectMap[subj] || subj;
                    }
                }

                if (weakestSubject && lowestRate < 1) {
                    document.getElementById('weaknessAlert').innerText = `目前最大弱點：${weakestSubject}`;
                } else {
                    document.getElementById('weaknessAlert').innerText = '';
                }

                renderRadar(labels, data);

                if (statsData.pending_count > 0) {
                    document.getElementById('pendingSection').style.display = 'block';
                    document.getElementById('pendingCount').innerText = `${statsData.pending_count} 待處理`;
                    loadPendingTasks();
                } else {
                    document.getElementById('pendingSection').style.display = 'none';
                }

                const tasksRes = await fetch('/api/dashboard/tasks');
                const tasksData = await tasksRes.json();
                renderTasks(tasksData.tasks);
            } catch (error) {
                console.error("Failed to load dashboard data:", error);
            }
        }

        function renderRadar(labels, data) {
            const ctx = document.getElementById('radarChart').getContext('2d');
            const style = getComputedStyle(document.body);
            const chartColor = style.getPropertyValue('--chart-blue').trim() || '#5AC8FA';

            if(window.radarChartInstance) window.radarChartInstance.destroy();
            window.radarChartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '掌握度',
                        data: data,
                        backgroundColor: chartColor + '33',
                        borderColor: chartColor,
                        borderWidth: 2,
                        pointBackgroundColor: chartColor,
                        pointBorderColor: 'var(--surface-color)',
                        pointHoverBackgroundColor: 'var(--surface-color)',
                        pointHoverBorderColor: chartColor
                    }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    scales: {
                        r: {
                            min: 0, max: 100,
                            ticks: { display: false },
                            grid: { color: gridColor },
                            pointLabels: { color: tickColor, font: { size: 14, family: 'system-ui' } }
                        }
                    },
                    maintainAspectRatio: false
                }
            });
        }

        // Utility to escape HTML
        function escapeHtml(unsafe) {
            if (typeof unsafe !== 'string') return unsafe;
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        async function loadPendingTasks() {
            const res = await fetch('/api/dashboard/pending');
            const data = await res.json();
            const list = document.getElementById('pendingList');
            list.innerHTML = '';

            data.pending.forEach(p => {
                const escapedText = escapeHtml(p.extracted_text);
                const escapedImagePath = escapeHtml(p.image_path);
                const escapedEdsCode = escapeHtml(p.eds_x_code);
                list.innerHTML += `
                    <div class="task-card pending-card" id="pending-${p.id}">
                        <div class="task-header">
                            <span style="color: var(--status-warning)">置信度: ${Math.round(p.llm_confidence*100)}%</span>
                            <span>${subjectMap[p.subject] || p.subject} | ${escapedEdsCode}</span>
                        </div>
                        ${escapedText ? `<p style="font-size: 15px;">${escapedText}</p>` : ''}
                        ${escapedImagePath ? `<img src="${escapedImagePath}">` : ''}
                        <div class="action-buttons">
                            <button class="btn btn-primary" onclick="approvePending(${p.id})">轉正入庫</button>
                            <button class="btn" style="background: var(--surface-secondary); color: var(--text-primary); border: 1px solid var(--divider);" onclick="rejectPending(${p.id})">刪除報廢</button>
                        </div>
                    </div>
                `;
            });
        }

        async function approvePending(id) {
            await fetch(`/api/staging/${id}/approve`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({priority: 'yellow'})
            });
            loadDashboard();
        }

        async function rejectPending(id) {
            await fetch(`/api/staging/${id}/reject`, { method: 'POST' });
            loadDashboard();
        }

        function renderTasks(tasks) {
            const list = document.getElementById('taskList');
            const emptyState = document.getElementById('emptyState');
            list.innerHTML = '';

            if (!tasks || tasks.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            tasks.forEach(t => {
                const escapedText = escapeHtml(t.extracted_text);
                const escapedMediaPath = escapeHtml(t.media_path);
                const escapedEdsCode = escapeHtml(t.eds_x_code);

                const mediaHtml = escapedMediaPath ? `<img src="${escapedMediaPath}">` : '';
                const textHtml = escapedText ? `<p>${escapedText}</p>` : '<p style="color: var(--text-secondary)">(原始對話覆盤)</p>';

                let priorityIcon = '';
                if(t.priority === 'red') priorityIcon = '🔴';
                if(t.priority === 'yellow') priorityIcon = '🟡';
                if(t.priority === 'green') priorityIcon = '🟢';

                list.innerHTML += `
                    <div class="task-card" id="task-${t.item_id}">
                        <div class="task-header">
                            <span>${priorityIcon} ${subjectMap[t.subject] || t.subject} | ${escapedEdsCode}</span>
                            <span class="badge">Box ${t.box}</span>
                        </div>
                        <div class="question-zone">
                            ${textHtml}
                            ${mediaHtml}
                        </div>

                        <div class="friction-zone" id="friction-${t.item_id}">
                            <textarea placeholder="請在此輸入解題關鍵字以解鎖答案..." oninput="checkInput(${t.item_id}, this)"></textarea>
                            <button class="btn btn-primary" id="btn-reveal-${t.item_id}" disabled onclick="revealAnswer(${t.item_id})">我已想好解釋，看答案</button>
                        </div>

                        <div class="answer-zone" id="answer-${t.item_id}">
                            <p style="font-size: 15px; color: var(--text-secondary);">請誠實自評您的邏輯是否正確：</p>
                            <div class="action-buttons">
                                <button class="btn btn-success" onclick="submitTask(${t.item_id}, 'correct')">我的邏輯正確</button>
                                <button class="btn btn-danger" onclick="submitTask(${t.item_id}, 'incorrect')">想錯了 / 忘了</button>
                                <button class="btn" style="background: var(--surface-secondary); color: var(--text-primary); border: 1px solid var(--divider);" onclick="submitTask(${t.item_id}, 'reject')">題目無效報廢</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function checkInput(id, textarea) {
            const btn = document.getElementById(`btn-reveal-${id}`);
            btn.disabled = textarea.value.trim().length === 0;
        }

        function revealAnswer(id) {
            document.getElementById(`friction-${id}`).style.display = 'none';
            document.getElementById(`answer-${id}`).style.display = 'block';
        }

        async function submitTask(id, action) {
            const card = document.getElementById(`task-${id}`);
            card.style.opacity = '0.5';
            card.style.pointerEvents = 'none';

            await fetch(`/api/task/${id}/action`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: action})
            });
            card.style.transform = 'scale(0.95)';
            setTimeout(() => loadDashboard(), 250);
        }

        // --- Modal Logic ---
        function openUploadModal() {
            document.getElementById('uploadModal').style.display = 'flex';
            document.getElementById('uploadText').value = '';
            document.getElementById('fileInput').value = '';
            document.getElementById('uploadPreview').style.display = 'none';
        }

        function closeUploadModal(e) {
            if (e.target.id === 'uploadModal') {
                document.getElementById('uploadModal').style.display = 'none';
            }
        }

        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const validTypes = ['image/jpeg', 'image/png', 'image/webp'];
                if (!validTypes.includes(file.type)) {
                    alert("僅支援 JPG, PNG 和 WEBP 格式的照片。");
                    input.value = '';
                    return;
                }
                if (file.size > 5 * 1024 * 1024) {
                    alert("檔案大小超過 5MB 限制。");
                    input.value = '';
                    return;
                }
                document.getElementById('fileName').innerText = file.name;
                document.getElementById('uploadPreview').style.display = 'block';
            }
        }

        async function submitUpload() {
            const fileInput = document.getElementById('fileInput');
            const textInput = document.getElementById('uploadText');
            const btn = document.getElementById('btnUploadSubmit');

            if (!fileInput.files[0] && !textInput.value.trim()) {
                alert("請輸入文字或上傳照片！");
                return;
            }

            btn.disabled = true;
            btn.innerText = "⏳ AI 解析中...";

            const formData = new FormData();
            if (textInput.value.trim()) formData.append("extracted_text", textInput.value.trim());
            if (fileInput.files[0]) formData.append("file", fileInput.files[0]);

            try {
                const res = await fetch('/api/ingest', {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    document.getElementById('uploadModal').style.display = 'none';
                    loadDashboard(); // Refresh dashboard
                } else {
                    alert("解析失敗，請重試。");
                }
            } catch (error) {
                console.error("Upload error:", error);
                alert("連線錯誤。");
            } finally {
                btn.disabled = false;
                btn.innerText = "送出解析";
            }
        }

        // Initialize
        loadDashboard();
    </script>
</body>
</html>
