<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDQ 學習極簡儀表板</title>
    <style>
        :root {
            --apple-bg: #F5F5F7;
            --apple-card: #FFFFFF;
            --apple-text: #1D1D1F;
            --apple-secondary: #86868B;
            --apple-accent: #0071E3;
            --apple-success: #34C759;
            --apple-warning: #FF9500;
            --apple-danger: #FF3B30;
            --apple-radius: 18px;
            --apple-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--apple-bg);
            color: var(--apple-text);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .badge {
            background: #E8E8ED;
            color: var(--apple-secondary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--apple-card);
            padding: 20px;
            border-radius: var(--apple-radius);
            box-shadow: var(--apple-shadow);
        }

        .stat-title {
            font-size: 13px;
            color: var(--apple-secondary);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card {
            background: var(--apple-card);
            border-radius: var(--apple-radius);
            padding: 28px;
            box-shadow: var(--apple-shadow);
            margin-bottom: 20px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card.slide-out {
            opacity: 0;
            transform: translateX(100px);
            height: 0;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .subject-tag {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 8px;
            background: #EBF3FF;
            color: var(--apple-accent);
        }

        .box-tag {
            font-size: 12px;
            color: var(--apple-secondary);
            font-weight: 500;
        }

        .question {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .friction-input {
            width: 100%;
            height: 80px;
            padding: 12px 16px;
            border: 1px solid #E5E5EA;
            border-radius: 12px;
            font-size: 14px;
            resize: none;
            margin-bottom: 16px;
            outline: none;
        }

        .friction-input:focus {
            border-color: var(--apple-accent);
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: var(--apple-accent);
            color: white;
            transition: background 0.2s;
        }

        .feedback-banner {
            margin-top: 12px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

        .feedback-banner.success {
            background: #E8F9ED;
            color: var(--apple-success);
            display: block;
        }

        .feedback-banner.error {
            background: #FFEBEB;
            color: var(--apple-danger);
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>RDQ 學習極簡儀表板</h1>
            <span class="badge">Leitner 遺忘曲線防禦</span>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">今日待防禦項目</div>
                <div class="stat-value" id="pendingCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">已成功晉級</div>
                <div class="stat-value" id="masteredCount" style="color: var(--apple-success);">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">當前 Leitner Box 區間</div>
                <div class="stat-value">Box 1-2</div>
            </div>
        </div>

        <div class="section-title">🎴 實體阻力閃卡特訓庫</div>

        <div id="cardsContainer">
            <!-- Dynamic cards -->
        </div>
    </div>

    <script>
        let masteredCounter = 0;

        async function fetchTasks() {
            try {
                const res = await fetch('/api/tasks');
                const data = await res.json();
                const container = document.getElementById('cardsContainer');
                container.innerHTML = '';

                document.getElementById('pendingCount').innerText = data.tasks.length;

                if (data.tasks.length === 0) {
                    container.innerHTML = `
                        <div class="card" style="text-align:center; padding: 40px;">
                            <div style="font-size:48px; margin-bottom:12px;">🎉</div>
                            <h2 style="font-size:20px; margin-bottom:8px;">今日防禦任務已全數完成！</h2>
                            <p style="color: var(--apple-secondary);">艾賓浩斯記憶曲線已成功鞏固，明天繼續保持！</p>
                        </div>
                    `;
                    return;
                }

                data.tasks.forEach(task => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.id = `card-${task.item_id}`;
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="subject-tag">${task.subject}</span>
                            <span class="box-tag">Leitner Box ${task.box_level}</span>
                        </div>
                        <div class="question">${task.question}</div>
                        <textarea class="friction-input" id="input-${task.item_id}" placeholder="✍️ 實體阻力解題區：請在此輸入觀念或數字關鍵字..."></textarea>
                        <button class="action-btn" onclick="verifyAnswer('${task.item_id}')">提交答案 ➔ 由 AI 自動驗證</button>
                        <div class="feedback-banner" id="banner-${task.item_id}"></div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function verifyAnswer(itemId) {
            const input = document.getElementById(`input-${itemId}`);
            const text = input.value.trim();
            const banner = document.getElementById(`banner-${itemId}`);

            if (!text) {
                alert('請先在實體阻力區留下思考軌跡或答案！');
                return;
            }

            try {
                const res = await fetch('/api/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({item_id: itemId, answer: text})
                });
                const data = await res.json();

                if (data.is_correct) {
                    banner.className = 'feedback-banner success';
                    banner.innerText = data.feedback;
                    masteredCounter++;
                    document.getElementById('masteredCount').innerText = masteredCounter;

                    setTimeout(() => {
                        const card = document.getElementById(`card-${itemId}`);
                        card.classList.add('slide-out');
                        setTimeout(() => {
                            card.remove();
                            const pending = parseInt(document.getElementById('pendingCount').innerText);
                            document.getElementById('pendingCount').innerText = Math.max(pending - 1, 0);
                        }, 400);
                    }, 1200);
                } else {
                    banner.className = 'feedback-banner error';
                    banner.innerText = data.feedback;
                }
            } catch (err) {
                console.error(err);
            }
        }

        fetchTasks();
    </script>
</body>
</html>
