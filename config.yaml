# RDQ Dashboard Configuration

# Database
db_path: "~/.education_ecosystem/review_index.db"

# Laplace Smoothing
# Formula: (confirmed_count + K * PRIOR) / (total_count + K)
LAPLACE_K: 1
LAPLACE_PRIOR: 0.5

# Ingestion
LLM_CONFIDENCE_THRESHOLD: 0.6
MEDIA_SAVE_DIR: "~/.education_ecosystem/media"

# Daily Schedule
DAILY_LIMIT: 30
